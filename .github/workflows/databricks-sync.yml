name: Databricks Sync

on:
  schedule:
    - cron: '0 0 * * *'   # daily at 00:00 UTC
  workflow_dispatch:

# allow this workflow to push commits
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # Install Databricks CLI (pick ONE of these two and keep it)
      - name: Install Databricks CLI (pinned)
        uses: databricks/setup-cli@v0.263.0
      # - name: Install Databricks CLI (track latest)
      #   uses: databricks/setup-cli@main

      - name: Show CLI version
        run: databricks -v

      - name: Ensure Databricks repo exists (create if missing)
        run: |
          set -e
          REPO_PATH="/Repos/tpjcw0309@gmail.com/claims-ml-pipeline"
          REPO_URL="https://github.com/<OWNER>/<REPO>.git"  # <- update this

          if databricks repos get "$REPO_PATH" >/dev/null 2>&1; then
            echo "Repo exists at $REPO_PATH"
          else
            echo "Creating repo at $REPO_PATH"
            databricks repos create "$REPO_URL" gitHub --path "$REPO_PATH"
          fi

      - name: Pull latest GitHub into Databricks Repos
        run: |
          databricks repos update "/Repos/tpjcw0309@gmail.com/claims-ml-pipeline" --branch main
        # You can also use a different branch here if needed.

      - name: Export Databricks workspace dir to local
        run: |
          # NOTE: include destination '.' and --overwrite
          databricks workspace export-dir "/Repos/tpjcw0309@gmail.com/claims-ml-pipeline" . --overwrite

      - name: Commit and push changes back to GitHub
        run: |
          git config user.name "databricks-bot"
          git config user.email "tpjcw0309@gmail.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Changes detected. Committing and pushing..."
            git add -A
            git commit -m "🔄 Daily sync from Databricks ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "No changes to commit. Repository is already up-to-date."
          fi

      - name: Notify on failure (Slack)
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          payload='{"text": ":x: Databricks Sync Failed – check Actions logs."}'
          curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
