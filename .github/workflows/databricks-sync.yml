name: Databricks Sync

on:
  schedule:
    - cron: '0 0 * * *'   # daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      REPO_WS: "/Workspace/Repos/tpjcw0309@gmail.com/claims-ml-pipeline"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install Databricks CLI (pinned)
        uses: databricks/setup-cli@v0.263.0

      - name: Show CLI version
        run: databricks -v

      - name: Ensure Databricks repo exists (create if missing)
        run: |
          set -e
          REPO_URL="https://github.com/hfepbook1/claims-ml-pipeline.git"
          if databricks repos get "$REPO_WS" >/dev/null 2>&1; then
            echo "Repo exists at $REPO_WS"
          else
            echo "Creating repo at $REPO_WS"
            databricks repos create "$REPO_URL" gitHub --path "$REPO_WS"
          fi

      - name: Pull latest GitHub into Databricks Repos
        run: |
          # Use the correct branch name here (main vs master)
          databricks repos update "$REPO_WS" --branch main || \
          databricks repos update "$REPO_WS" --branch master

      # OPTIONAL: If the workspace repo already contains heavy dirs, delete them
      # so export won't hit the 10MB limit. Comment these out if you want to keep
      # data/models INSIDE workspace (not recommended).
      - name: Remove heavy paths in Workspace (pre-export cleanup)
        run: |
          set -e
          for p in "$REPO_WS/data" "$REPO_WS/models" "$REPO_WS/.vs"; do
            databricks workspace delete "$p" --recursive || true
          done

      - name: Export allowlisted folders (skip data/models/.vs)
        run: |
          set -e
          mkdir -p .github workflows frontend backend notebooks scripts
          # Export these directories if they exist
          for d in ".github" "frontend" "backend" "notebooks" "scripts"; do
            databricks workspace export-dir "$REPO_WS/$d" "$d" --overwrite || echo "skip $d"
          done
          # Export top-level files we care about
          for f in "README.md" "requirements.txt" "pyproject.toml" "setup.cfg" "Dockerfile" ".gitignore"; do
            databricks workspace export "$REPO_WS/$f" "$f" --overwrite || true
          done

      - name: Enforce ignore of heavy artifacts (local cleanup)
        run: |
          set -e
          # Make sure big/generated stuff never gets pushed
          echo "" >> .gitignore
          printf "\n# Large data & generated artifacts\ndata/\nmodels/\n.vs/\n.ipynb_checkpoints/\n" >> .gitignore
          # Remove from index if previously tracked
          git rm -r --cached data models ".vs" ".ipynb_checkpoints" 2>/dev/null || true
          # Also delete local copies to avoid re-adding
          rm -rf data models ".vs" ".ipynb_checkpoints" || true

      - name: Commit and push changes back to GitHub
        run: |
          git config user.name "databricks-bot"
          git config user.email "tpjcw0309@gmail.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Changes detected. Committing and pushing..."
            git add -A
            git commit -m "🔄 Daily sync from Databricks ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "No changes to commit. Repository is already up-to-date."
          fi
